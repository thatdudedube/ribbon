<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ribbon</title>
<meta name="theme-color" content="#1f5c45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ribbon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script type="module" src="ribbon-firebase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column. Sticky snowy header with countdown; people are wrapped gift boxes (each in their own paper); gift tags mark status; bottom tab bar; sheets slide up. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --ink:#14251d; --muted:#5a6b62; --line:#dbe3dc; --soft:#e8efe9;
  --accent:#1f5c45; --accent-ink:#ffffff; --gold:#8a5f10; --ribbon:#c9962b; --warn:#b5332e;
  --p-Emeka:#b8322f; --p-Dube:#2d6b4f; --p-Chioma:#7a3f73; --p-Mum:#c18a24; --p-Dad:#2c4a7a; --p-Parents:#2a7472;
  --display:"Young Serif", "Iowan Old Style", Georgia, serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --hand:"Kalam", "Segoe Print", "Comic Sans MS", cursive;
  --snow:rgba(31,92,69,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1511; --surface:#14201a; --ink:#e7efe9; --muted:#97a89e; --line:#24342b; --soft:#1a2921;
    --accent:#5cc196; --accent-ink:#06140d; --gold:#e1b45a; --ribbon:#d9a948; --warn:#ec7c6a;
    --p-Emeka:#c9463f; --p-Dube:#3c8a66; --p-Chioma:#9a5a92; --p-Mum:#cf9a35; --p-Dad:#4669a3; --p-Parents:#3f9a97;
    --snow:rgba(255,255,255,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1511; --surface:#14201a; --ink:#e7efe9; --muted:#97a89e; --line:#24342b; --soft:#1a2921;
  --accent:#5cc196; --accent-ink:#06140d; --gold:#e1b45a; --ribbon:#d9a948; --warn:#ec7c6a;
  --p-Emeka:#c9463f; --p-Dube:#3c8a66; --p-Chioma:#9a5a92; --p-Mum:#cf9a35; --p-Dad:#4669a3; --p-Parents:#3f9a97;
  --snow:rgba(255,255,255,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line);overflow:hidden}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
header .wrap{position:relative}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font:400 26px/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font:600 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
h2{font:400 20px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:700 12px/1.2 var(--body);margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meta{display:flex;gap:8px;align-items:center}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
select.chipbtn{appearance:none;padding-right:12px}
.status-note{font-size:13px;color:var(--muted);padding:6px 0 0}
.status-note:empty{display:none}
.status-note.bad{color:var(--warn)}
/* People as wrapped boxes */
.recs{display:flex;gap:10px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.rec{--paper:var(--accent);flex:0 0 auto;width:118px;border:0;background:var(--surface);border-radius:14px;padding:0;text-align:left;cursor:pointer;display:grid;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line) inset;scroll-snap-align:start;overflow:hidden;transition:transform .18s ease, box-shadow .18s ease}
.rec .box{position:relative;height:46px;background:
  repeating-linear-gradient(135deg, rgba(255,255,255,.14) 0 6px, transparent 6px 14px), var(--paper)}
.rec .box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;transform:translateX(-50%);background:var(--ribbon);opacity:.95}
.rec .box::after{content:"";position:absolute;left:0;right:0;top:50%;height:8px;transform:translateY(-50%);background:var(--ribbon);opacity:.95}
.bow{position:absolute;left:50%;top:6px;width:30px;height:16px;transform:translateX(-50%);z-index:1}
.bow::before,.bow::after{content:"";position:absolute;top:0;width:14px;height:14px;border:3px solid var(--ribbon);border-radius:50% 50% 50% 0;background:transparent}
.bow::before{left:0;transform:rotate(-30deg)} .bow::after{right:0;transform:scaleX(-1) rotate(-30deg)}
.rec .lab{padding:8px 10px 10px;display:grid;gap:5px}
.rec b{font:400 17px/1.1 var(--display)}
.rec small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.rec[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper) inset, 0 6px 18px rgba(0,0,0,.12);transform:translateY(-2px)}
.rec[aria-pressed="true"] .bow{animation:wiggle .5s ease}
@keyframes wiggle{30%{transform:translateX(-50%) rotate(-8deg)}60%{transform:translateX(-50%) rotate(6deg)}}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease}
.bar i.slight{background:var(--ribbon)}
.bar i.over{background:repeating-linear-gradient(135deg,var(--warn) 0 6px,#d9675e 6px 12px)}
.countdown{font-family:var(--hand);font-size:15px;color:var(--gold);white-space:nowrap}
/* Content */
.section{display:grid;gap:10px;padding-top:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.nx{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.nx:hover{background:var(--soft)}
.recwrap{position:relative;flex:0 0 auto;display:grid;scroll-snap-align:start}
.pfbtn{position:absolute;top:7px;right:7px;width:32px;height:32px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#1f3a2e;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pfbtn svg{width:18px;height:18px}
.listbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:4px 2px 0}
.listbar h2{margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px 8px;font:600 14px var(--body);color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button.locked{opacity:.5;cursor:not-allowed}
.seg .ct{font-size:12px;font-weight:700;background:var(--line);border-radius:999px;padding:1px 7px}
.seghint{font-size:13px;color:var(--muted);margin:-2px 2px 0}
.gp{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gp div{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.gp div:first-child{border-top:0}
.gp b{color:var(--muted);font-weight:600}
.tracker .trkh{display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;width:100%;text-align:left}
.listhead{display:grid;gap:6px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--paper,var(--accent))}
.prefs{font-size:14px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.prefs span{white-space:pre-wrap}
.item{position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px 12px 18px;cursor:pointer;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;animation:rise .28s ease both}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.item.claimed::before{background:var(--ribbon)}
.item.bought::before{background:var(--accent)}
.item.bought{background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 60%)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.item .star{color:var(--gold);margin-right:4px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.price{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
/* Gift-tag pills */
.pill{position:relative;display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 16px;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);border-radius:0 6px 6px 0}
.pill::before{content:"";position:absolute;left:7px;top:50%;width:4px;height:4px;border-radius:50%;background:var(--surface);transform:translateY(-50%)}
.pill.claimed{background:var(--gold);color:var(--surface)}
.pill.bought{background:var(--accent);color:var(--accent-ink)}
.tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:6px;padding:1px 7px}
.amber{color:var(--gold);font-size:13px;font-weight:700}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .1s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.surprise{padding:14px;border-radius:14px;background:var(--soft);display:flex;gap:12px;align-items:center}
.surprise .mini{flex:0 0 auto}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent)}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font:600 13px var(--body);cursor:pointer;color:var(--muted);white-space:nowrap;min-height:36px}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipsep{flex:0 0 1px;background:var(--line);margin:6px 2px}
.ptr{position:fixed;top:0;left:0;bottom:0;width:4px;z-index:60;background:var(--accent);opacity:0;transition:opacity .2s}
.sheet{touch-action:pan-y}
.filter button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.settle{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px;align-items:center;border-left:5px solid var(--warn)}
.settle .who{font:400 18px/1.25 var(--display)}
.settle .amt{font:400 24px var(--display);font-variant-numeric:tabular-nums;color:var(--warn)}
.square{padding:22px 16px;text-align:center;border-radius:14px;background:var(--soft);display:grid;gap:6px;justify-items:center}
.nets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.net{padding:12px;display:grid;gap:2px;border-top:4px solid var(--paper,var(--line))}
.net b{font:400 16px var(--display)}
.net span{font-variant-numeric:tabular-nums;font-weight:700}
.pos{color:var(--accent)} .neg{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}
nav.tabs button{flex:1;max-width:200px;background:none;border:0;padding:8px 4px;border-radius:12px;font-weight:600;font-size:13px;color:var(--muted);display:grid;justify-items:center;gap:2px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft)}
nav.tabs svg{width:22px;height:22px}
.fab{position:fixed;right:max(16px, calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:16px;padding:13px 18px 13px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab svg{width:20px;height:20px}
.scrim{position:fixed;inset:0;background:rgba(5,12,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:14px;border-top:5px solid var(--paper,var(--accent))}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--warn);font-size:13px;font-weight:600}
.err:empty{display:none}
.who-grid{display:grid;gap:12px}
.nametag{--paper:var(--accent);display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:transform .15s ease}
.nametag:active{transform:scale(.98)}
.nametag .mini{flex:0 0 auto}
.nametag b{font:400 22px var(--display);display:block}
.nametag span{font-size:13px;color:var(--muted)}
.mini{position:relative;width:40px;height:34px;border-radius:5px;background:repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 4px, transparent 4px 9px), var(--paper)}
.mini::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);background:var(--ribbon)}
.mini::after{content:"";position:absolute;left:-3px;right:-3px;top:4px;height:8px;border-radius:2px;background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.split-grid{display:grid;grid-template-columns:auto repeat(3,1fr) auto;gap:6px;align-items:center;font-size:14px}
.split-grid input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 6px;text-align:right;font-variant-numeric:tabular-nums}
.split-grid .sum{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;min-width:44px}
.lock{display:grid;gap:18px;padding:24px 0}
.lock .card{padding:18px;display:grid;gap:14px}
.lock .hero{display:grid;gap:6px}
.lock .hero h2{font-size:28px}
.notice{position:relative;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--warn);color:var(--ink);background:var(--surface);font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;justify-self:start}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);vertical-align:middle;animation:pulse 1.6s ease infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
.bday{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:color-mix(in srgb, var(--paper) 12%, var(--surface));border:1px solid color-mix(in srgb, var(--paper) 40%, var(--line));font-size:14px}
.bday.urgent,.bdaynote.urgent{border-color:var(--warn)}
.bdaynote{display:flex;gap:10px;align-items:flex-start;border-color:color-mix(in srgb, var(--paper) 50%, var(--line))}
.cake{position:relative;flex:0 0 auto;width:22px;height:20px;margin-top:2px;border-radius:3px 3px 4px 4px;background:repeating-linear-gradient(90deg,var(--paper) 0 5px,color-mix(in srgb,var(--paper) 70%,#fff) 5px 7px)}
.cake::before{content:"";position:absolute;left:50%;top:-9px;width:3px;height:8px;margin-left:-1.5px;background:var(--ribbon);border-radius:1px}
.cake::after{content:"";position:absolute;left:50%;top:-14px;width:6px;height:7px;margin-left:-3px;background:#f2b33d;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flicker 1.2s ease-in-out infinite}
@keyframes flicker{50%{transform:scale(.8) rotate(4deg);opacity:.8}}
.bdbadge{font:13px var(--hand);color:var(--warn);line-height:1.1}
.iconbtn{padding:6px 9px;display:inline-grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.fbitem{padding:12px;border:1px solid var(--line);border-radius:12px;display:grid;gap:6px;background:var(--bg)}
.fbitem .meta2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.fbitem p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.st{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.st.planned{background:var(--ribbon);color:#1d1406}
.st.done{background:var(--accent);color:var(--accent-ink)}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}
.vote[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.picks{padding:14px;display:grid;gap:10px;border-top:4px solid var(--ribbon)}
.pickrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;animation:rise .3s ease both}
.pickrow .pk{display:grid;gap:2px}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#1d1406;background:var(--soft)}
.medal.m1{background:var(--ribbon)} .medal.m2{background:#c9ced3} .medal.m3{background:#d39a6a}
.pts{display:grid;gap:3px;justify-items:end;min-width:64px;font-variant-numeric:tabular-nums;font-size:13px}
.pts i{display:block;height:5px;border-radius:5px;background:var(--ribbon);justify-self:stretch}
.toppick{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--ribbon);color:#1d1406;vertical-align:middle;animation:shine 2.4s ease infinite}
@keyframes shine{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ribbon) 25%,transparent)}}
.ranklist{display:grid;gap:8px;max-height:52vh;overflow:auto}
.rankopt{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;width:100%}
.rankopt .rk{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:800}
.rankopt.on{border-color:var(--ribbon);background:color-mix(in srgb,var(--ribbon) 12%,var(--bg))}
.rankopt.on .rk{border:0;background:var(--ribbon);color:#1d1406}
.tracker{padding:12px 14px;display:grid;gap:8px;margin-top:12px;border-top:4px solid var(--ribbon)}
.trk{display:flex;gap:6px;flex-wrap:wrap}
.trkp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;cursor:pointer}
.trkp .tick{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--soft);color:var(--muted)}
.trkp.ok .tick{background:var(--paper);color:#fff;animation:pop .35s ease}
.trkp.me{cursor:default;opacity:.7}
@keyframes pop{50%{transform:scale(1.3)}}
.cmt{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);max-width:90%}
.cmt.mine{justify-self:end;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.thanks{grid-column:1/-1;display:grid;gap:6px;padding:8px;border-radius:10px;background:color-mix(in srgb,var(--ribbon) 10%,var(--surface))}
.thanks img,.thumb{width:100%;max-height:220px;object-fit:cover;border-radius:8px}
.bchart{padding:14px;display:grid;gap:12px}
.brow{display:grid;gap:5px}
.btrack{position:relative;height:12px;border-radius:6px;background:var(--soft);display:flex;overflow:hidden}
.btrack i{display:block;height:100%;transition:width .6s ease}
.btrack .b1{background:var(--paper)}
.btrack .b1.over{background:repeating-linear-gradient(135deg,var(--warn) 0 6px,#d9675e 6px 12px)}
.btrack .b2{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--paper) 45%,transparent) 0 5px,transparent 5px 9px)}
.btrack .b0{background:repeating-linear-gradient(135deg,var(--line) 0 5px,transparent 5px 9px);border-radius:6px}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin:0 3px 0 8px}
.key.k1{background:var(--accent)} .key.k2{background:repeating-linear-gradient(135deg,var(--accent) 0 3px,transparent 3px 6px)}
.stars{color:var(--gold);letter-spacing:1px}
.taste{padding:14px;display:grid;gap:10px;border-top:4px solid var(--paper,var(--accent))}
.ideas{display:grid;gap:8px}
.idea{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);animation:rise .3s ease both}
.idea .btn{justify-self:start}
.starpick{display:flex;gap:6px}
.starpick button{font-size:34px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px;transition:transform .12s ease}
.starpick button.on{color:var(--ribbon)}
.starpick button:active{transform:scale(1.2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toastbtn{margin-left:12px;background:none;border:0;color:var(--ribbon);font-weight:800;cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;animation:toastin .25s ease both;max-width:90vw;text-align:center}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* Wrapping moment */
.wrapfx{position:fixed;inset:0;z-index:35;display:grid;place-items:center;pointer-events:none}
.wrapfx .big{position:relative;width:130px;height:110px;border-radius:10px;background:repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 8px, transparent 8px 18px), var(--paper);animation:drop .5s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.wrapfx .big::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;transform:translateX(-50%) scaleY(0);transform-origin:top;background:var(--ribbon);animation:ribbon .3s .35s ease forwards}
.wrapfx .big::after{content:"";position:absolute;left:0;right:0;top:50%;height:14px;transform:translateY(-50%) scaleX(0);background:var(--ribbon);animation:ribbonx .3s .55s ease forwards}
.wrapfx .bow{top:-14px;width:56px;height:30px;opacity:0;animation:bowpop .35s .8s cubic-bezier(.2,1.6,.4,1) forwards}
.wrapfx .bow::before,.wrapfx .bow::after{width:26px;height:26px;border-width:5px}
.wrapfx .lbl{position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);font:22px var(--hand);color:var(--ink);white-space:nowrap;background:var(--surface);padding:4px 14px;border-radius:8px;opacity:0;animation:fadein .3s .9s ease forwards}
@keyframes drop{from{transform:translateY(-40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes ribbon{to{transform:translateX(-50%) scaleY(1)}}
@keyframes ribbonx{to{transform:translateY(-50%) scaleX(1)}}
@keyframes bowpop{from{opacity:0;transform:translateX(-50%) scale(.2)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes fadein{to{opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:36}
/* Tour */
.tour-spot{position:fixed;z-index:40;border-radius:14px;box-shadow:0 0 0 9999px rgba(5,12,8,.62);pointer-events:none;transition:all .25s ease}
.tour-card{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,420px);z-index:41;background:var(--surface);color:var(--ink);border-radius:18px;padding:18px;display:grid;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);border-top:5px solid var(--gold)}
.tour-card .steps{font:15px var(--hand);color:var(--gold)}
.tour-block{position:fixed;inset:0;z-index:39}
.demo{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;cursor:pointer;background:var(--bg);text-align:left;width:100%}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.giftopen{--paper:var(--p-Chioma);justify-self:center;position:relative;width:110px;height:92px;margin:22px 0 6px;cursor:pointer;border:0;background:none;padding:0}
.giftopen .body{position:absolute;inset:22px 6px 0;border-radius:6px;background:repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 7px, transparent 7px 15px), var(--paper)}
.giftopen .body::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;transform:translateX(-50%);background:var(--ribbon)}
.giftopen .lid{position:absolute;left:0;right:0;top:8px;height:20px;border-radius:5px;background:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.giftopen .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;transform:translateX(-50%);background:var(--ribbon)}
.giftopen .bow{top:-10px}
.giftopen.open .lid{transform:translateY(-26px) rotate(-14deg)}
.giftopen:not(.open){animation:jiggle 2.2s ease infinite}
@keyframes jiggle{0%,80%,100%{transform:none}84%{transform:rotate(-5deg)}88%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}}
.example{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px}
.example div{background:var(--soft);border-radius:10px;padding:8px;display:grid;gap:2px}
.example b{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .wrapfx .big::before{transform:translateX(-50%)} .wrapfx .big::after{transform:translateY(-50%)} .wrapfx .bow,.wrapfx .lbl{opacity:1}
}
@media (max-width:380px){ .nets{grid-template-columns:1fr} .example{grid-template-columns:1fr} }
@media (max-width:420px){ h1{font-size:21px} .meta{gap:6px} .chipbtn{padding:6px 10px} }
.updbar{position:relative;margin:8px 0 2px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent);color:var(--accent-ink);padding:10px 12px 10px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;animation:updIn .35s ease}
.updbar .btn{background:#fff;color:var(--accent);border:0;min-height:36px;padding:6px 14px}
.updbar .x{background:transparent;border:0;color:inherit;font-size:20px;line-height:1;padding:4px 6px;cursor:pointer}
@keyframes updIn{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.pushcard{display:grid;gap:8px;margin:10px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pushcard .actions{margin:0}
.ver{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header><canvas id="snow" aria-hidden="true"></canvas><div class="wrap" style="padding-bottom:0">
  <div class="top">
    <h1 id="title"><small>Ribbon</small>Christmas gifts</h1>
    <div class="meta">
      <button id="srchBtn" class="chipbtn iconbtn" type="button" aria-label="Search every list" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
      <button id="fbBtn" class="chipbtn iconbtn" type="button" aria-label="Send feedback about the app" title="Feedback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4.5 5.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4.5 3.5V16.5h-1a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/><path d="M8 9.5h8M8 12.5h5"/></svg></button>
      <select id="year" class="chipbtn" aria-label="Year"></select>
      <button id="meBtn" class="chipbtn" type="button" aria-label="Change who is using the app">Who are you?</button>
    </div>
  </div>
  <div class="row" style="padding-top:4px"><span class="countdown" id="countdown"></span></div>
  <div id="statusNote" class="status-note" role="status">Loading the shared lists…</div>
  <div id="updBar"></div>
</div></header>
<div class="wrap" style="padding-top:0;padding-bottom:0"><div id="pushCard"></div></div>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="9" width="17" height="11.5" rx="2"/><path d="M2.5 9h19M12 9v11.5M12 9C10 5 6.5 5.5 7.5 8c.5 1 2.5 1 4.5 1Zm0 0c2-4 5.5-3.5 4.5-1-.5 1-2.5 1-4.5 1Z"/></svg>Add idea</button>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-view="lists" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="8" width="17" height="12.5" rx="2"/><path d="M3.5 12h17M12 8v12.5M12 8C10 4 6.5 4.5 7.5 7c.5 1 2.5 1 4.5 1Zm0 0c2-4 5.5-3.5 4.5-1-.5 1-2.5 1-4.5 1Z"/></svg>Lists</button>
  <button type="button" data-view="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 7.5c-.6-1.6-2-2.5-3.8-2.5-2.4 0-3.7 1.6-3.7 3.6V12m0 0v4.5c0 1-.5 2-1.5 2.5h9.5M6 12h7.5"/></svg>Money</button>
  <button type="button" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Budgets &amp; splits <span id="badge" class="dot" style="display:none" aria-label="Needs your answer"></span></span></button>
</nav>
<div id="overlay"></div><div id="tour"></div><div id="fx"></div><canvas id="confetti" aria-hidden="true"></canvas>
<script>
(function(){
"use strict";
const PEOPLE = ["Emeka","Dube","Chioma"];
const RECIPS = ["Emeka","Dube","Chioma","Mum","Dad"];
const BUDGETED = ["Emeka","Dube","Chioma","Mum","Dad"];
const label = r => r==="Parents" ? "Mum & Dad" : r;
const poss = r => r==="Parents" ? "Mum & Dad's" : r+"'s";
const DEFAULT_CONFIG = {
  budgets:{Emeka:330,Dube:330,Chioma:330,Mum:150,Dad:150},
  splits:{Emeka:{Dube:70,Chioma:30},Dube:{Emeka:70,Chioma:30},Chioma:{Emeka:50,Dube:50},Mum:{Emeka:35,Dube:35,Chioma:30},Dad:{Emeka:40,Dube:40,Chioma:20},Parents:{Emeka:37.5,Dube:37.5,Chioma:25}}
};
const NOW_YEAR = new Date().getFullYear();
const APP_VERSION = "%%RIBBON_VERSION%%";
const IS_DEV = /^%%/.test(APP_VERSION);
const S = {
  db:null, config:null, items:[], payments:[], profiles:{}, proposals:[], prefs:{}, feedback:[], picks:[], rankDraft:[], comments:[], assets:undefined, ai:null, rateDraft:{stars:0,tags:[]}, thanksPhoto:"", thanksPhotoId:"", sample:undefined, downloads:undefined, loaded:{config:false,items:false,payments:false,profiles:false,proposals:false},
  err:"", stale:false, readonly:false,
  me: null, uid:null, email:"", authReady:false, importDone:null, login:{step:"signin", msg:"", email:""}, year: Math.max(Number(store("gift-year"))||NOW_YEAR, NOW_YEAR),
  view: "lists", rec: store("gift-rec") || "Mum", filter:"all", peek:{}
};
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gbp = n => "£" + (Math.round((Number(n)||0)*100)/100).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
/* Settings are kept as a history of entries, each applying from a year onwards. */
function cfgHistory(){
  const c=S.config||{};
  if(Array.isArray(c.history) && c.history.length) return c.history.slice().sort((a,b)=>Number(a.fromYear)-Number(b.fromYear));
  return [{fromYear:0, budgets:c.budgets||DEFAULT_CONFIG.budgets, splits:c.splits||DEFAULT_CONFIG.splits, carry:!!c.carry}];
}
function cfgFor(y){
  const h=cfgHistory(); let best=h[0]; h.forEach(e=>{ if(Number(e.fromYear)<=y) best=e; });
  if(!(best.splits||{}).Parents){ const m=(best.splits||{}).Mum||{}, d=(best.splits||{}).Dad||{}; const par={}; PEOPLE.forEach(p=>{ par[p]=Math.round(((Number(m[p])||0)+(Number(d[p])||0))/2*10)/10; }); best=Object.assign({},best,{splits:Object.assign({},best.splits,{Parents:par})}); }
  return best;
}
const cfg = () => cfgFor(S.year);
const isSibling = r => PEOPLE.includes(r);
const hiddenFor = r => !!S.me && S.me===r && isSibling(r);
function safeUrl(u){ try{ const x=new URL(u); return (x.protocol==="https:"||x.protocol==="http:")? x.href : ""; }catch(e){ return ""; } }
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }

/* ---------- sign-in (Firebase Auth) ---------- */
function checkSession(){ /* identity comes from Firebase Auth, see connect() */ }
function signOut(){ if(T){ T=null; $("#tour").innerHTML=""; } maybeTour.done=false; S.me=null; S.peek={}; S.login={step:"signin",msg:"",email:S.email||""}; closeSheet(); if(window.RB) RB.signOut(); render(); }
function authMsg(e){
  const c=(e&&e.code)||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "That email or password isn't right.";
  if(/email-already-in-use/.test(c)) return "There's already an account with that email. Sign in instead.";
  if(/weak-password/.test(c)) return "Use at least 6 characters.";
  if(/invalid-email|missing-email/.test(c)) return "That email doesn't look right.";
  if(/too-many-requests/.test(c)) return "Too many tries. Wait a few minutes and try again.";
  if(/network/.test(c)) return "No connection. Check your internet and try again.";
  if(/requires-recent-login/.test(c)) return "Sign out and back in, then try again.";
  return "Something went wrong. Try again.";
}

function toast(msg, actionLabel, action){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  const s=document.createElement("span"); s.textContent=msg; t.appendChild(s);
  if(actionLabel){ const b=document.createElement("button"); b.type="button"; b.className="toastbtn"; b.textContent=actionLabel; b.addEventListener("click",()=>{ t.remove(); action(); }); t.appendChild(b); }
  document.body.appendChild(t); setTimeout(()=>t.remove(), actionLabel?7000:2400);
}

/* ---------- money maths ---------- */
function yearItems(){ return S.items.filter(i => Number(i.year)===S.year); }
/* Lists: this year's items plus anything from earlier years that was never bought. */
function listItems(){ return S.items.filter(i => Number(i.year)===S.year || (i.status!=="bought" && Number(i.year)<S.year)); }
/* On your own list you only see ideas you added yourself (or imported ones), never others' suggestions or ones you removed. */
function visibleOnOwn(i){ return !i.hiddenByOwner && (!i.addedBy || i.addedBy===i.for); }
function shownItems(r){ const all=listItems().filter(i=>i.for===r); return hiddenFor(r) ? all.filter(visibleOnOwn) : all; }
function shareOf(i,r){ return i.for===r ? 1 : (i.for==="Parents" && (r==="Mum"||r==="Dad")) ? 0.5 : 0; }
function spentIn(r,y){ return S.items.filter(i=>shareOf(i,r) && i.status==="bought" && Number(i.year)===y).reduce((a,i)=>a+(Number(i.price)||0)*shareOf(i,r),0); }
/* Budget carry-over: an underspend carries over in full; an overspend comes off next year's budget, capped at 25% of it. */
/* Carry-over (when switched on): an overspend comes off next year's budget straight away, capped at 25%.
   An underspend (including a year with nothing bought) is added in full, from 1 January of the new year. Years before the app started don't carry. */
const APP_START=2026;
function budgetFor(r,y,depth){
  const base=Number(cfgFor(y).budgets[r])||0; let carry=0, pending=0;
  if(cfgFor(y).carry && y>APP_START && depth<30){
    const prev=budgetFor(r,y-1,depth+1); const diff=Math.round((prev.total-spentIn(r,y-1))*100)/100;
    if(diff<0) carry=Math.max(diff, -Math.round(0.25*base*100)/100);
    else if(todayDate() >= new Date(y,0,1)) carry=diff;
    else pending=diff;
  }
  return {base, carry, pending, total:Math.round((base+carry)*100)/100};
}
function budgetInfo(r){ return budgetFor(r,S.year,0); }
function overState(spent,total){ if(!total || spent<=total) return ""; return spent<=total*1.10 ? "slight" : "over"; }
function ledger(){
  const owe = {}; PEOPLE.forEach(a=>{ owe[a]={}; PEOPLE.forEach(b=>owe[a][b]=0); });
  const lines = [];
  yearItems().filter(i=>i.status==="bought" && PEOPLE.includes(i.paidBy) && Number(i.price)>0).forEach(i=>{
    const sp = cfgFor(Number(i.year)).splits[i.for] || {}; const tot = Object.values(sp).reduce((a,b)=>a+(Number(b)||0),0) || 100;
    PEOPLE.forEach(c=>{ const pct=Number(sp[c])||0; if(c!==i.paidBy && pct>0){ const amt=i.price*pct/tot; owe[c][i.paidBy]+=amt; lines.push({item:i, from:c, to:i.paidBy, amt}); } });
  });
  S.payments.filter(p=>Number(p.year)===S.year).forEach(p=>{ if(owe[p.from] && owe[p.from][p.to]!==undefined) owe[p.from][p.to]-=Number(p.amount)||0; });
  const net = {}; PEOPLE.forEach(x=>{ net[x]=0; PEOPLE.forEach(y=>{ net[x]+=owe[y][x]-owe[x][y]; }); });
  const cred = PEOPLE.filter(x=>net[x]>0.005).map(x=>({x,v:net[x]})).sort((a,b)=>b.v-a.v);
  const debt = PEOPLE.filter(x=>net[x]<-0.005).map(x=>({x,v:-net[x]})).sort((a,b)=>b.v-a.v);
  const transfers=[]; let i=0,j=0;
  while(i<debt.length && j<cred.length){ const v=Math.min(debt[i].v,cred[j].v); transfers.push({from:debt[i].x,to:cred[j].x,amt:v}); debt[i].v-=v; cred[j].v-=v; if(debt[i].v<0.005)i++; if(cred[j].v<0.005)j++; }
  const paid={}, share={}; PEOPLE.forEach(p=>{paid[p]=0;share[p]=0;});
  yearItems().filter(i=>i.status==="bought" && PEOPLE.includes(i.paidBy) && Number(i.price)>0).forEach(i=>{
    paid[i.paidBy]+=Number(i.price); const sp=cfgFor(Number(i.year)).splits[i.for]||{}; const tot=Object.values(sp).reduce((a,b)=>a+(Number(b)||0),0)||100;
    PEOPLE.forEach(c=>{ share[c]+=i.price*(Number(sp[c])||0)/tot; });
  });
  return {net, transfers, lines, paid, share};
}
function spendFor(r){ let bought=0, planned=0; listItems().filter(i=>shareOf(i,r)).forEach(i=>{ const p=(Number(i.price)||0)*shareOf(i,r); if(i.status==="bought") bought+=p; else if(i.status==="claimed") planned+=p; }); return {bought,planned}; }

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.view===S.view?"page":"false"));
  const bd=document.getElementById("badge"); if(bd) bd.style.display = needsMyOk(openProposal()) ? "" : "none";
  $("#meBtn").textContent = S.me ? S.me : "Sign in";
  const ttl=$("#title"); const want=inXmasSeason()?"Christmas gifts":"Gift planner"; if(ttl && ttl.dataset.t!==want){ ttl.dataset.t=want; ttl.innerHTML=`<small>Ribbon</small>${want}`; }

/* A bought gift counts as given (and is revealed to the person) on 25 December of its year, or earlier if the buyer marks it as given. */

const BDAY_WINDOW=30, BDAY_URGENT=7;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function todayDate(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
/* Christmas look runs 1 November to 6 January; the countdown runs 1 November to Christmas Day. */
function inXmasSeason(){ const t=todayDate(), m=t.getMonth(); return m===10 || m===11 || (m===0 && t.getDate()<=6); }
function xmasCountdownOn(){ const t=todayDate(); return t.getMonth()===10 || (t.getMonth()===11 && t.getDate()<=25); }
function bdayParts(r){ const b=(S.prefs[r]||{}).birthday; if(!b||!/^\d{2}-\d{2}$/.test(b)) return null; const [mm,dd]=b.split("-").map(Number); return {mm,dd}; }

  let next=new Date(t.getFullYear(),b.mm-1,b.dd); if(next<t) next=new Date(t.getFullYear()+1,b.mm-1,b.dd);
  const days=Math.round((next-t)/864e5);
  return {days, year:next.getFullYear(), label:next.getDate()+" "+MONTHS[next.getMonth()], soon:days<=BDAY_WINDOW, urgent:days<=BDAY_URGENT};
}
function bdayText(r, short){
  const b=bdayInfo(r); if(!b||!b.soon) return "";

  if(b.days===0) return r===S.me ? "Happy birthday!" : `It's ${r}'s birthday today!`;
  if(short) return b.days===1 ? "Birthday tomorrow" : `Birthday in ${b.days} days`;
  return b.days===1 ? `${who} birthday is tomorrow` : `${who} birthday in ${b.days} days`;
}
const SIZE_FIELDS=[["tops","Tops / shirts"],["trousers","Trousers (waist / leg)"],["shoes","Shoes (UK)"],["dress","Dress / suit"],["otherSizes","Other sizes (ring, watch, hat…)"]];

  if(op) h+=`<div class="section"><h3>Suggested change</h3>${proposalCard(op)}</div>`;
  h+=`<div class="section"><div class="row"><h3>Budgets for ${S.year}</h3>${(!op&&!S.readonly)?`<button type="button" class="btn small" data-act="propose">Suggest a change</button>`:""}</div>
  <div class="card scroll"><table><thead><tr><th>Person</th><th class="r">Budget</th>${PEOPLE.map(p=>`<th class="r">${esc(p)}</th>`).join("")}</tr></thead><tbody>

function proposeSheet(base, replacing){

  <h2>${replacing?"Suggest changes":"Suggest a change"}</h2>

  <h3>Who chips in, and how much (%)</h3><p class="hint" style="margin:0">Each row is the person receiving gifts. Each row must add up to 100.</p>

  ${RECIPS.map(r=>`<b>${esc(label(r))}</b>${PEOPLE.map(p=> p===r?`<span class="hint" style="text-align:right">–</span>`:`<input aria-label="${esc(p)}'s share of ${esc(r)}'s gifts" id="s-${r}-${p}" name="s-${r}-${p}" type="number" inputmode="decimal" min="0" max="100" step="any" value="${Number((c.splits[r]||{})[p])||0}">`).join("")}<span class="sum" id="sum-${r}"></span>`).join("")}</div></div>
  <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="carry" name="carry" ${c.carry?"checked":""} style="margin-top:3px;width:18px;height:18px">
  <span>Carry budgets over between years. Anything left unspent is added to next year in full. Overspending is taken off next year's budget, but never more than 25% of it.</span></label>
  <div class="two"><div class="field"><label for="p-from">Starts from</label><select id="p-from" name="fromYear">${[NOW_YEAR,NOW_YEAR+1].map(y=>`<option value="${y}" ${Number(c.fromYear)===y||(!c.fromYear&&y===NOW_YEAR)?"selected":""}>${y}${y===NOW_YEAR?" (this year)":""}</option>`).join("")}</select></div>

  <div class="actions"><button class="btn" type="submit">Send to the others</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>`);

function updateSums(){ RECIPS.forEach(r=>{ const el=document.getElementById("sum-"+r); if(!el) return; let s=0; PEOPLE.forEach(p=>{ const i=document.getElementById(`s-${r}-${p}`); if(i) s+=Number(i.value)||0; }); el.textContent=(Math.round(s*100)/100)+"%"; el.className="sum "+(Math.abs(s-100)<0.01?"pos":"neg"); }); }

function openSheet(html, person){ if(!$("#overlay").innerHTML) navPush("sheet"); $("#overlay").innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" ${person?`style="--paper:var(--p-${esc(person)})"`:""}>${html}</div></div>`; const f=$("#overlay").querySelector("input,select,textarea,button"); if(f) f.focus(); }
function closeSheet(fromBack){ const had=!!$("#overlay").innerHTML; $("#overlay").innerHTML=""; if(had && !fromBack && history.state && history.state.rb==="sheet"){ NAV.skip=true; history.back(); } }
function opts(list, sel, blank){ return (blank?`<option value="">${blank}</option>`:"") + list.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join(""); }

function words(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w.length>2 && !["the","and","for","with","one","new","set"].includes(w)); }
function similar(a,b){ const A=new Set(words(a)), B=new Set(words(b)); if(!A.size||!B.size) return false; let n=0; A.forEach(w=>{ if(B.has(w)) n++; }); return n/Math.min(A.size,B.size)>=0.6; }
function forHint(r){
  if(r===S.me) return "This goes on your own wish list. Everyone can see it, but you won't see if someone buys it.";
  if(isSibling(r)) return "This goes under wraps. "+r+" won't see it. Only the other two will.";
  if(r==="Parents") return "A joint present for Mum and Dad together. It counts half towards each of their budgets.";
  return "Everyone can see ideas for "+r+".";
}

function sharesOf(i){
  const sp=cfgFor(Number(i.year)).splits[i.for]||{}; const tot=Object.values(sp).reduce((a,b)=>a+(Number(b)||0),0)||100;
  return PEOPLE.filter(p=>Number(sp[p])>0).map(p=>({p, amt:(Number(i.price)||0)*Number(sp[p])/tot}));
}

async function shrinkImage(file){
  const img=await new Promise((ok,no)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>ok(im); im.onerror=no; im.src=u; });
  const s=Math.min(1, 1600/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); return await new Promise(ok=>c.toBlob(ok,"image/jpeg",0.85));
}

/* ---------- festive effects ---------- */
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function snowOn(){ return !REDUCED && store("gift-snow")!=="off" && inXmasSeason(); }
function todayDaysToXmas(){ const t=todayDate(); let x=new Date(t.getFullYear(),11,25); if(t>x) x=new Date(t.getFullYear()+1,11,25); return Math.round((x-t)/864e5); }
function countdownText(){
  const now=new Date(); let y=now.getFullYear(); let xmas=new Date(y,11,25);
  const day=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(day>xmas){ if(day.getMonth()===11 && day.getDate()<=31) return "Hope it was a good one"; xmas=new Date(y+1,11,25); }
  const d=Math.round((xmas-day)/86400000);
  if(d===0) return "Merry Christmas!"; if(d===1) return "Christmas Eve. One sleep to go!";
  return d+" sleeps till Christmas";
}
(function snow(){
  const c=document.getElementById("snow"); if(!c) return; const ctx=c.getContext("2d"); let flakes=[], w=0, hgt=0, raf=0;
  function size(){ const r=c.getBoundingClientRect(); w=c.width=Math.round(r.width*devicePixelRatio); hgt=c.height=Math.round(r.height*devicePixelRatio); flakes=Array.from({length:Math.round(r.width/14)},()=>({x:Math.random()*w,y:Math.random()*hgt,r:(Math.random()*1.8+0.8)*devicePixelRatio,s:(Math.random()*0.35+0.15)*devicePixelRatio,d:Math.random()*Math.PI*2})); }
  function tick(){
    raf=0; if(!snowOn() || document.hidden){ ctx.clearRect(0,0,w,hgt); return; }
    ctx.clearRect(0,0,w,hgt); ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--snow").trim()||"rgba(255,255,255,.5)";
    flakes.forEach(f=>{ f.y+=f.s; f.d+=0.01; f.x+=Math.sin(f.d)*0.3*devicePixelRatio; if(f.y>hgt+4){ f.y=-4; f.x=Math.random()*w; } ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); });
    raf=requestAnimationFrame(tick);
  }
  window.restartSnow=()=>{ size(); if(!raf) raf=requestAnimationFrame(tick); };
  window.addEventListener("resize", ()=>{ size(); });
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !raf) raf=requestAnimationFrame(tick); });
  size(); raf=requestAnimationFrame(tick);
})();
function confetti(n){
  if(REDUCED) return; const c=document.getElementById("confetti"); const ctx=c.getContext("2d");
  const dpr=devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr;
  const cs=getComputedStyle(document.documentElement); const cols=["--p-Emeka","--p-Dube","--p-Chioma","--p-Mum","--p-Dad","--ribbon"].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:n||120},()=>({x:c.width/2+(Math.random()-.5)*80*dpr,y:c.height*0.42,vx:(Math.random()-.5)*14*dpr,vy:(-Math.random()*13-5)*dpr,w:(Math.random()*6+5)*dpr,h:(Math.random()*10+6)*dpr,a:Math.random()*6,va:(Math.random()-.5)*0.35,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){ const el=t-t0; ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.vy+=0.35*dpr; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.globalAlpha=Math.max(0,1-el/1800); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.a*2))); ctx.restore(); });
    if(el<1900) requestAnimationFrame(f); else ctx.clearRect(0,0,c.width,c.height);
  })(t0);
}
function wrapFx(person,label){
  const fx=document.getElementById("fx");
  fx.innerHTML=`<div class="wrapfx" style="--paper:var(--p-${esc(person)})"><div class="big"><span class="bow"></span><span class="lbl">${esc(label)}</span></div></div>`;
  setTimeout(()=>confetti(140), REDUCED?0:900);
  setTimeout(()=>{ fx.innerHTML=""; }, REDUCED?1400:2300);
}

let T=null;

  {sel:".recs", title:"Everyone's lists", body:"Tap a person to open their list. The bar shows how much of their budget has been spent."},

function startTour(){ S.view="lists"; if(S.rec===S.me) S.rec="Mum"; S.filter="all"; closeSheet(); render(); T={i:0,demo:0,opened:false}; drawTour(); }

function drawTour(){
  if(!T){ $("#tour").innerHTML=""; return; }
  const steps=tourSteps(), st=steps[T.i]; const el=st.sel?document.querySelector(st.sel):null;
  if(el) el.scrollIntoView({block:"nearest",inline:"nearest"});
  const r=el?el.getBoundingClientRect():null;
  const spot = r ? `<div class="tour-spot" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div>` : `<div class="tour-spot" style="left:50%;top:40%;width:0;height:0"></div>`;
  const below = !r || r.top < window.innerHeight/2;
  const pos = r ? (below ? `top:${Math.min(r.bottom+16, window.innerHeight-260)}px` : `bottom:${Math.max(16, window.innerHeight-r.top+16)}px`) : `top:22%`;
  const d=DEMO[T.demo];
  const giftHtml = st.gift ? `<button type="button" class="giftopen ${T.opened?"open":""}" data-tour="open" aria-label="Open the present"><span class="lid"><span class="bow"></span></span><span class="body"></span></button>` : "";
  const budgetHtml = st.budget ? `<div class="example">
      <div><span class="hint">Under budget</span><b>£150 budget, £120 spent</b><span>Next year: <b>£180</b></span><span class="hint">The whole £30 left over is added.</span></div>
      <div><span class="hint">Slightly over</span><b>£150 budget, £160 spent</b><span>Next year: <b>£140</b></span><span class="hint">The £10 over is taken off.</span></div>
      <div><span class="hint">Well over</span><b>£150 budget, £250 spent</b><span>Next year: <b>£112.50</b></span><span class="hint">Only 25% (£37.50) can be taken off.</span></div>
    </div><p class="hint" style="margin:0">Carry-over is currently <b>${cfg().carry?"on":"off"}</b>. Changing it needs all three of you to agree.</p>` : "";
  const demo = st.demo ? `<button type="button" class="demo" data-tour="demo"><span class="row"><b>Leather gloves</b><span class="price">£45.00</span></span><span class="stages">${DEMO.map((x,k)=>`<span class="pill ${k===T.demo?(x[0]==="idea"?"":x[0]):""}" style="${k===T.demo?"":"opacity:.45"}">${x[1]}</span>`).join("")}</span><span class="hint">${d[2]}</span><span class="hint" style="font-weight:600">${T.demo<2?"Tap to move it to "+DEMO[T.demo+1][1]:"Tap to start again"}</span></button>` : "";
  $("#tour").innerHTML = `<div class="tour-block"></div>${spot}<div class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tourTitle" style="${pos}">
    <div class="steps">${T.i+1} of ${steps.length}</div><h2 id="tourTitle">${esc(st.title)}</h2><p style="margin:0">${esc(st.body)}</p>${giftHtml}${budgetHtml}${demo}
    <div class="actions"><button type="button" class="btn" data-tour="next">${T.i===steps.length-1?"Finish":"Next"}</button>${T.i>0?`<button type="button" class="btn ghost" data-tour="back">Back</button>`:""}<button type="button" class="btn ghost" data-tour="skip">Skip tour</button></div></div>`;
  const nb=$("#tour").querySelector('[data-tour="next"]'); if(nb) nb.focus();
}
document.addEventListener("click", ev=>{
  const t=ev.target.closest("[data-tour]"); if(!t||!T) return; ev.stopPropagation();
  const k=t.dataset.tour, n=tourSteps().length;
  if(k==="demo"){ T.demo=(T.demo+1)%3; if(T.demo===2) confetti(60); }

/* ---------- AI gift ideas ---------- */
async function aiIdeas(r){
  if(!S.sample) return;
  S.ai={r,loading:true}; render();
  const t=tasteFor(r);
  const wish=S.items.filter(i=>i.for===r && i.status!=="bought" && !i.hiddenByOwner).map(i=>({item:i.title,note:i.note||undefined,price:i.price||undefined,mostWanted:!!i.mostWanted}));
  const past=S.items.filter(i=>i.for===r && i.status==="bought").map(i=>({year:i.year,item:i.title,price:i.price,rating:i.rating?{stars:i.rating.stars,notes:i.rating.tags,comment:i.rating.comment}:"not rated"}));
  const bi=budgetInfo(r), sp=spendFor(r);
  const prompt=`You help a UK family pick Christmas presents. Suggest 6 specific gift ideas for ${r} (${isSibling(r)?"an adult sibling":"a parent"}).
Use their sizes and favourites, their wish list, and especially how they rated past gifts: lean towards what scored 4-5 stars and away from what scored 1-2 or was tagged "Not my style", "Wrong size" or "Already had one".
Avoid anything in their "Not keen on" list. Do not repeat anything already on the wish list or already given.${bdayInfo(r)&&bdayInfo(r).soon?` Their birthday is in ${bdayInfo(r).days} days, so birthday-appropriate ideas are welcome.`:""} Mix price points, mostly within the budget left. Prices in GBP, rough.
Return ONLY a JSON array of 6 objects: {"title": short product or experience name, "why": one sentence linking it to their tastes, "price_gbp": number, "where": a UK shop or "experience"}.

Profile (sizes, likes, dislikes, birthday): ${profileText(r)}
Budget left this year: £${Math.max(0,bi.total-sp.bought).toFixed(0)} of £${bi.total.toFixed(0)}
Wish list: ${JSON.stringify(wish).slice(0,4000)}
Past gifts and ratings: ${JSON.stringify(past).slice(0,4000)}
Average rating so far: ${t.rated.length?t.avg.toFixed(1):"no ratings yet"}`;
  try{
    let v = typeof S.sample.json==="function" ? await S.sample.json(prompt,{modelTier:"default"}) : null;
    if(!v){ const res=await S.sample(prompt,{modelTier:"default"}); const m=String(res.text||"").match(/\[[\s\S]*\]/); v=m?JSON.parse(m[0]):null; }
    if(v && !Array.isArray(v) && Array.isArray(v.ideas)) v=v.ideas;
    if(!Array.isArray(v) || !v.length) throw {code:"empty"};
    S.ai={r, ideas:v.slice(0,6).filter(x=>x&&x.title)};
  }catch(e){
    const c=e&&e.code;
    S.ai={r, err: c==="not_granted" ? "AI ideas weren't allowed. You can allow them next time you tap the button." : c==="rate_limited" ? "Too many requests just now. Try again in a minute." : "Couldn't get ideas this time. Try again."};
    if(c==="not_granted") S.sample=null;
  }
  render();
}

    const budgets=BUDGETED.map(r=>{ const bi=budgetInfo(r), sp=spendFor(r); const hideIt=S.me===r&&isSibling(r); return {"Year":S.year,"Person":r,"Budget (£)":bi.total,"Spent (£)":hideIt?"Hidden":Math.round(sp.bought*100)/100}; });
    const wb=X.utils.book_new();

    const c=e&&e.code; if(c!=="declined") toast(c==="unavailable"||c==="not_granted"?"Downloads aren't available here.":"Couldn't make the spreadsheet. Try again.");

/* ---------- writes ---------- */
async function write(fn, errEl){
  if(!S.db){ if(errEl) errEl.textContent="Not connected yet. Try again in a moment."; return false; }
  try{ await fn(); return true; }
  catch(e){
    const code=e&&e.code;
    let msg="That didn't save. Check your connection and try again.";
    if(code==="invalid_argument"){ msg="You don't have permission to change these lists."; S.readonly=true; }
    else if(code==="quota_exceeded") msg="The app's storage is full. Delete some old items and try again.";
    else if(code==="resource_exhausted") msg="Too many changes at once. Wait a few seconds and try again.";
    if(errEl) errEl.textContent=msg; else toast(msg); return false;
  }
}

(function swipes(){
  let sx=0, sy=0, st=0, edge=false, ok=false;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  document.addEventListener("touchstart",e=>{
    if(e.touches.length!==1){ ok=false; return; }
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();
    edge = ios && sx<24;
    ok = !!S.me && !e.target.closest(".recs,.fchips,input,textarea,select,#tour,.sheet,.trk,.seg button") ;
    if(e.target.closest(".sheet")){ ok=false; SH.start(e); }
  },{passive:true});
  document.addEventListener("touchmove",e=>SH.move(e),{passive:true});
  document.addEventListener("touchend",e=>{
    SH.end(e);
    const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy, dt=Date.now()-st;
    if(edge && dx>70 && Math.abs(dy)<60){ goBack(); return; }
    if(!ok || dt>600 || Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)*0.6) return;
    const dir = dx<0 ? 1 : -1;
    if(S.view==="lists" && isSibling(S.rec) && S.rec!==S.me && !["history","foryou"].includes(S.filter)){
      if(dir===1 && S.side!=="wraps"){ S.side="wraps"; render(); return; }
      if(dir===-1 && S.side==="wraps"){ S.side="wish"; render(); return; }
    }
    const i=VIEWS.indexOf(S.view)+dir; if(i>=0 && i<VIEWS.length){ if(VIEWS[i]==="lists") history.back(); else setView(VIEWS[i]); }
  },{passive:true});
})();
/* Drag a sheet down to close it. */
const SH={y0:0,dy:0,el:null,
  start(e){ const s=e.target.closest(".sheet"); if(!s || s.scrollTop>0) { this.el=null; return; } this.el=s; this.y0=e.touches[0].clientY; this.dy=0; },
  move(e){ if(!this.el) return; this.dy=Math.max(0,e.touches[0].clientY-this.y0); if(this.dy>8){ this.el.style.transform=`translateY(${this.dy}px)`; this.el.style.transition="none"; } },
  end(){ if(!this.el) return; const s=this.el; this.el=null; s.style.transition="transform .2s ease"; if(this.dy>110){ s.style.transform="translateY(100%)"; setTimeout(()=>closeSheet(),180); } else s.style.transform=""; }
};

}
function scheduleMidnight(){
  const n=new Date(), next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1,0,0,5);
  setTimeout(()=>{ checkUpdate(false); scheduleMidnight(); }, next-n);
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && lastUpdCheck!==todayDate().toDateString()) checkUpdate(false); });

/* ---------- reminders on this phone ---------- */
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const standalone=()=>window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
function pushState(){
  if(!window.RB) return "loading";
  if(isIOS() && !standalone()) return "install";
  if(!RB.pushSupported) return "unsupported";
  if(Notification.permission==="denied") return "denied";
  if(Notification.permission==="granted" && store("ribbon-push-token")) return "on";
  return "off";
}
function pushRow(){
  const s=pushState();
  if(s==="on") return `<button class="btn ghost" type="button" data-act="disablepush">Turn off reminders on this phone</button>`;
  if(s==="off") return `<button class="btn" type="button" data-act="enablepush">Turn on reminders on this phone</button>`;
  if(s==="install") return `<p class="hint" style="margin:0">To get reminders on iPhone, open Ribbon from your home screen: in Safari tap Share, then Add to Home Screen.</p>`;
  if(s==="denied") return `<p class="hint" style="margin:0">Notifications are blocked for Ribbon. Turn them on in your phone's Settings to get reminders.</p>`;
  return "";
}
function renderPushCard(){
  const el=$("#pushCard"); if(!el) return;
  const later=Number(store("ribbon-push-later"))||0, s=pushState();
  const show=S.me && (s==="off"||s==="install") && Date.now()-later>7*864e5;
  const html=!show?"":`<div class="pushcard"><b>${s==="install"?"Install Ribbon for reminders":"Get birthday and Christmas reminders"}</b><span class="hint">${s==="install"?"In Safari tap Share, then Add to Home Screen. Open Ribbon from there and sign in again.":"Ribbon can tell you 30 and 7 days before each birthday, and when someone suggests a change or comments."}</span><div class="actions">${s==="off"?`<button type="button" class="btn small" data-act="enablepush">Turn on</button>`:""}<button type="button" class="btn small ghost" data-act="pushlater">Not now</button></div></div>`;
  if(el.dataset.h!==html){ el.dataset.h=html; el.innerHTML=html; }
}

/* ---------- one-time import from the old app ---------- */
async function importOld(file){
  if(!file) return;
  try{
    const j=JSON.parse(await file.text());
    if(!j || !j.collections || !Array.isArray(j.collections.items)) throw new Error("shape");
    const n=Object.values(j.collections).reduce((a,c)=>a+(Array.isArray(c)?c.length:0),0);
    toast("Importing "+n+" records…");
    await RB.importAll(j, S.me);
    closeSheet(); confetti(120); toast("Imported "+n+" records from the old app");
  }catch(e){ toast(e&&e.message==="shape" ? "That file isn't an export from the old app." : "Import didn't work. Try again."); }
}

/* ---------- connect ---------- */
render();
(async function connect(){
  const ok = await new Promise(res=>{ if(window.RB) return res(true); window.addEventListener("rb-ready",()=>res(true),{once:true}); window.addEventListener("rb-failed",()=>res(false),{once:true}); setTimeout(()=>res(!!window.RB),20000); });
  if(!ok){ S.err="Couldn't start Ribbon. Check your connection, then close and reopen the app."; render(); return; }
  const db=RB.db; S.db=db; S.sample=RB.sample; S.downloads=RB.downloads; S.assets=RB.assets;
  checkUpdate(false); scheduleMidnight();
  let subs=[], timer=null;
  const stop=()=>{ subs.forEach(u=>{ try{u();}catch(e){} }); subs=[]; clearTimeout(timer); };
  const KEYS=["config","items","payments","profiles","proposals","prefs"];
  const done=()=>{ if(KEYS.every(k=>S.loaded[k])){ clearTimeout(timer); S.stale=false; } render(); };
  const asList=s=>s.docs.map(d=>Object.assign({id:d.id},d.data()));
  const H={
    config:   s=>{ S.config = s.exists ? s.data() : null; S.loaded.config=true; if(S.loaded.proposals) S.proposals.forEach(applyIfAgreed); },
    items:    s=>{ S.items=asList(s); S.loaded.items=true; },
    payments: s=>{ S.payments=asList(s); S.loaded.payments=true; },
    proposals:s=>{ S.proposals=asList(s); S.loaded.proposals=true; if(S.loaded.config) S.proposals.forEach(applyIfAgreed); },
    prefs:    s=>{ const ps={}; s.docs.forEach(d=>{ ps[d.id]=d.data(); }); S.prefs=ps; S.loaded.prefs=true; },
    profiles: s=>{ const ps={}; s.docs.forEach(d=>{ ps[d.id]=d.data(); }); S.profiles=ps; S.loaded.profiles=true; }
  };
  const REF={
    config:   ()=>db.doc("config/main"),
    items:    ()=>db.collection("items"),
    payments: ()=>db.collection("payments"),
    proposals:()=>db.collection("proposals").where("status","==","open"),
    prefs:    ()=>db.collection("prefs"),
    profiles: ()=>db.collection("profiles")
  };
  function start(){
    stop(); S.stale=false; S.err="";
    timer=setTimeout(()=>{ S.stale=true; render(); },12000);
    const soft=(ref,cb)=>{ try{ subs.push(ref.onSnapshot(cb,()=>{})); }catch(e){} };
    soft(db.collection("comments"), s=>{ S.comments=asList(s); render(); });
    soft(db.collection("picks"), s=>{ S.picks=asList(s); render(); });
    soft(db.collection("feedback"), s=>{ S.feedback=asList(s); });
    soft(db.doc("meta/import"), s=>{ S.importDone=!!s.exists; });
    KEYS.forEach(k=>{ try{ subs.push(REF[k]().onSnapshot(s=>{ try{ H[k](s); }catch(err){} done(); }, e=>{ S.err="Lost connection to the shared lists ("+((e&&e.code)||"unknown")+"). Close and reopen the app to try again."; render(); })); }catch(err){} });
  }
  RB.onAuth(async user=>{
    if(!user){ stop(); S.me=null; S.uid=null; S.authReady=true; S.loaded={config:false,items:false,payments:false,profiles:false,proposals:false}; render(); return; }
    S.uid=user.uid; S.email=user.email||"";
    let name=null;
    try{ name=await RB.memberName(); }catch(e){ S.authReady=true; S.login={step:"signin",email:S.email,msg:e&&e.code==="unavailable"?"No connection. Check your internet and try again.":"Couldn't finish signing in. Try again."}; RB.signOut(); render(); return; }
    S.authReady=true;
    if(!name){ S.me=null; S.login={step:"notallowed",msg:""}; render(); return; }
    S.me=name; S.peek={}; if(S.justSignedIn){ S.justSignedIn=false; toast("Welcome, "+name); }
    start(); render();
    if(pushState()==="on") RB.refreshPush(name).catch(()=>{});
  });
})();
})();
</script>
